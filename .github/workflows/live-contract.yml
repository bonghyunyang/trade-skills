name: live contract

# The offline suite replays recordings, so by construction it cannot notice
# UN Comtrade changing its API. This is the alarm for that: it calls the real
# endpoint and checks the assumptions the whole skill rests on — that the
# preview tier still needs no key, that the fields we parse still exist, that
# every partner still arrives in one call, that Taiwan's data still sits under
# code 490. Weekly is often enough; a break here is a silent-wrong-answer bug
# waiting to happen, not an outage.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run live contract tests
        env:
          TRADE_STATS_LIVE: "1"
          TRADE_STATS_CONTACT: https://github.com/bonghyunyang/trade-skills
          # Be a courteous client on a free public tier, especially from CI.
          TRADE_STATS_MIN_INTERVAL: "3.0"
        working-directory: tests
        run: python3 -m unittest test_live -v

      - name: Open an issue when the contract breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live contract tests failed — UN Comtrade API may have changed";
            const body = [
              "The weekly live contract run failed.",
              "",
              "This suite exists to catch upstream changes that the offline",
              "suite cannot see, because the offline suite replays recorded",
              "responses. A failure here usually means one of:",
              "",
              "- the preview endpoint now requires an API key",
              "- response fields were renamed or removed",
              "- the all-partners-in-one-call behaviour changed",
              "- reference snapshots (areas.json / hs.json) drifted",
              "",
              "Next step: re-record fixtures and diff them.",
              "```",
              "python3 tests/record_fixtures.py --force",
              "```",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-contract",
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-contract"],
              });
            }
